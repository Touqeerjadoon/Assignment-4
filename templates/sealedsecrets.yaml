apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secret.name }}
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
spec:
  encryptedData:
    mongo-root-username: {{ .Values.secret.data.mongoRootUsername }}
    mongo-root-password: {{ .Values.secret.data.mongoRootUserPassword }}
  template:
    metadata:
      name: {{ .Values.secret.name }}
    type: Opaque
